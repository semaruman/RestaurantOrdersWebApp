<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Ресторан - </title>
</head>

<body onload="getRestaurantName(); getMenu()">
    <div style="text-align: center;">
        <h1 class="d-inline-block">Ресторан - <span id="restaurant-name"></span></h1>
    </div>
    <nav>
        <button onclick="getMenu()">Меню</button>
        <a href="">О ресторане</a>
        <a href="">Контакты</a>
        <a href="">Отзывы</a>
    </nav>

    <div style="text-align: center;">
        <h2 class="d-inline-block">Меню</h2>
        <br />
        <div id="dish-list" class="card w-75 shadow p-3 d-inline-block"></div>
    </div>


    <script>
        function getRestaurantName() {
            const urlParams = new URLSearchParams(window.location.search);
            const restaurantName = urlParams.get('name');
            document.getElementById('restaurant-name').innerText = restaurantName;
        }
        async function getMenu() {
            const urlParams = new URLSearchParams(window.location.search);
            const restaurantName = urlParams.get('name');

            const response = await fetch(`/${restaurantName}/menu`);
            const menu = await response.json();

            const container = document.getElementById('dish-list');
            container.innerHTML = '';
            menu.forEach(dish => {
                const div = document.createElement('div');

                div.classList.add('card');
                div.classList.add('d-inline-block');
                div.classList.add('w-25');
                div.classList.add('p-2');

                div.innerHTML = `
                    <h3>${dish.name}</h3>
                    <p>${dish.Photo}</p>
                    <p>${dish.ingredients}</p>
                    <strong>${dish.price}</strong>
                `;
                container.appendChild(div);
            });
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>

</html>
