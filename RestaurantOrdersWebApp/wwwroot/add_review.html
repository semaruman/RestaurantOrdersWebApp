<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Главная</title>
</head>

<body onload="getRestaurantName()">

    <div style="text-align: center;">
        <form id="reviewForm">
            <p>Опишите свое мнение о ресторане <span id="restaurant-name"></span></p>
            <textarea type="text" name="reviewText" id="reviewText"></textarea>
            <p>Поставьте оценку (от 1 до 5)</p>
            <input type="range" id="rating" name="rating" step="0.1" min="1" max="5" required>
            <br>
            <button type="submit">Оставить отзыв</button>
        </form>
    </div>

    <button onclick="goToIndex()" class="btn btn-secondary"
                style="position: fixed; bottom: 88.5%; right: 3%; z-index: 1000;">На главную</button>

    <script>
        document.getElementById('reviewForm').onsubmit = async function (e) {
            e.preventDefault();
            const urlParams = new URLSearchParams(window.location.search);
            const restaurantName = urlParams.get('name');

            let reviewText = document.getElementById('reviewText').value;
            let rating = parseFloat(document.getElementById('rating').value);
            
            // Создаем JSON объект
            const data = {
                "Text": reviewText,
                "Rating": rating
            };

            const response = await fetch(`/${restaurantName}/reviews/add`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(data)
            })
            var respData = response.json();

        }
    </script>


    <script src="common.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>

</html>
