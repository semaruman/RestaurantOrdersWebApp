<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Главная</title>
</head>

<body onload="getAllRestaurants()">
    <h2>Выберите ресторан</h2>
    <div id="restaurants-list"></div>



    <script>
        async function getAllRestaurants() {
            const response = await fetch("/getAlRestaurants");
            const data = await response.json();

            const container = document.getElementById('restaurants-list');
            container.innerHTML = '';

            data.forEach(restaurant => {
                const a = document.createElement('a');
                a.style.cssText = 'display: block; text-decoration: none; color: inherit;';
                a.href = '/' + restaurant.name;

                const div = document.createElement('div');

                div.className = 'card';
                div.innerHTML = `
                    <h3>${restaurant.name}</h3>
                    <p>${restaurant.description}</p>
                    <p>Контакты: ${restaurant.contacts}</p>
                `;
                
                a.appendChild(div);

                a.querySelectorAll('*').forEach(el => {
                    el.style.all = 'revert';
                });
                container.appendChild(a);
            });
        }
    </script>
</body>

</html>
