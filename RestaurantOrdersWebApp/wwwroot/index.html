<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Главная</title>
</head>

<body onload="getAllRestaurants()">

    <div style="text-align: center;">
        <h2 class="d-inline-block">Выберите ресторан</h2>
        <br />
        <div id="restaurants-list" class="card w-75 shadow p-3 d-inline-block"></div>
    </div>


    <script>
        async function getAllRestaurants() {
            const response = await fetch("/getAlRestaurants");
            const data = await response.json();

            const container = document.getElementById('restaurants-list');
            container.innerHTML = '';

            data.forEach(restaurant => {
                const a = document.createElement('a');
                a.style.cssText = 'display: block; text-decoration: none; color: inherit;';
                a.href = '/' + restaurant.name;

                const div = document.createElement('div');

                div.classList.add('card');
                div.classList.add('d-inline-block');
                div.classList.add('w-25');

                div.innerHTML = `
                    <h3>${restaurant.name}</h3>
                    <p>${restaurant.description}</p>
                    <p>Контакты: ${restaurant.contacts}</p>
                `;

                a.appendChild(div);
                container.appendChild(a);
            });
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>

</html>
