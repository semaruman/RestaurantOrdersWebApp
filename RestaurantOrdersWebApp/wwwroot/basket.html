<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Ресторан - </title>
</head>

<body onload="getRestaurantName(); getBasket()">
    <div style="text-align: center;" class="mb-5">
        <h1 class="d-inline-block">Ресторан - <span id="restaurant-name"></span></h1>
        <br />
        <nav>
            <button onclick="goToMenu()" class="btn btn-secondary me-3">Меню</button>
            <button onclick="goToAbout()" class="btn btn-secondary me-3">О ресторане</button>
            <button onclick="goToContacts()" class="btn btn-secondary me-3">Контакты</button>
            <button onclick="goToReviews()" class="btn btn-secondary me-3">Отзывы</button>
            <button onclick="goToOrders()" class="btn btn-secondary me-3">Заказы</button>
            <button onclick="goToIndex()" class="btn btn-secondary">На главную</button>

            <button onclick="goToBasket()" class="btn btn-secondary" style="position: fixed; bottom: 88.5%; right: 5%; z-index: 1000;">Корзина</button>
        </nav>
    </div>


    <div style="text-align: center;">
        <h2 class="d-inline-block">Корзина</h2>
        <br />
        <div id="basket" class="card w-75 shadow p-3 d-inline-block"></div>
    </div>


    <script>
        function getRestaurantName() {
            const urlParams = new URLSearchParams(window.location.search);
            const restaurantName = urlParams.get('name');
            document.getElementById('restaurant-name').innerText = restaurantName;
            document.title = restaurantName;
        }
        async function getBasket() {
            const urlParams = new URLSearchParams(window.location.search);
            const restaurantName = urlParams.get('name');

            const response = await fetch(`/${restaurantName}/basket`);
            const basket = await response.json();

            const container = document.getElementById('basket');
            container.innerHTML = '';
            basket.forEach(dish => {
                const div = document.createElement('div');

                div.classList.add('card');
                div.classList.add('d-inline-block');
                div.classList.add('w-25');
                div.classList.add('p-2');
                div.classList.add('mb-2');
                div.classList.add('me-2');

                /*
                const button = document.createElement('button');
                button.textContent = 'Удалить из корзины';
                button.onclick = () => AddToBasket(dish.id);
                button.classList.add('btn');
                */

                div.innerHTML = `
                    <h3>${dish.name}</h3>
                    <p>${dish.Photo}</p>
                    <strong>${dish.price} ₽</strong>
                    <br/>
                `;
                //div.appendChild(button);
                container.appendChild(div);
            });
        }
        async function goToMenu() {
            const urlParams = new URLSearchParams(window.location.search);
            const restaurantName = urlParams.get('name');

            window.location.href = `restaurant.html?name=${restaurantName}`;
        }
        async function AddToBasket(id) {
            const urlParams = new URLSearchParams(window.location.search);
            const restaurantName = urlParams.get('name');
            const response = await fetch(`/${restaurantName}/basket/add?dishId=${id}`, {method: 'POST',});
        }
        async function goToContacts() {
            const urlParams = new URLSearchParams(window.location.search);
            const restaurantName = urlParams.get('name');
            window.location.href = `contacts_restaurant.html?name=${restaurantName}`;
        }

        function goToAbout() {
            const urlParams = new URLSearchParams(window.location.search);
            const restaurantName = urlParams.get('name');
            window.location.href = `about_restaurant.html?name=${restaurantName}`;
        }
        function goToReviews() {
            const urlParams = new URLSearchParams(window.location.search);
            const restaurantName = urlParams.get('name');
            window.location.href = `restaurant_reviews.html?name=${restaurantName}`;
        }
        function goToOrders() {
            const urlParams = new URLSearchParams(window.location.search);
            const restaurantName = urlParams.get('name');
            window.location.href = `orders.html?name=${restaurantName}`;
        }
        function goToBasket() {
            const urlParams = new URLSearchParams(window.location.search);
            const restaurantName = urlParams.get('name');
            window.location.href = `basket.html?name=${restaurantName}`;
        }
        function goToIndex() {
            window.location.href = "index.html";
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>

</html>
