<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Админ панель | Добавление ресторана</title>
</head>

<body>

    <div style="text-align: center;">
        <nav>
            <button onclick="goToAdmin()" class="btn btn-secondary">Вернуться в админ-панель</button>
            <button onclick="goToIndex()" class="btn btn-secondary">На главную</button>
        </nav>
    </div>

    <!-- Отправка сообщения -->
    <form id="sendForm">
        <textarea type="text" id="sendMessage" placeholder="message" required></textarea><br>
        <input type="text" id="sendRestaurant" placeholder="restaurantName" required><br>
        <button type="submit">Изменить описание</button>
        <span id="postStatus"></span>
    </form>

    <hr>

    <!-- Получение сообщения -->
    <form id="getForm">
        <input type="text" id="getRestaurant" placeholder="restaurantName" required><br>
        <button type="submit">Получить описание текущего ресторана</button>
        <span id="getStatus"></span>
    </form>

    <script>
        // Отправка POST
        document.getElementById('sendForm').onsubmit = async (e) => {
            e.preventDefault();
            const message = document.getElementById('sendMessage').value;
            const name = document.getElementById('sendRestaurant').value;
            const statusSpan = document.getElementById('postStatus');

            statusSpan.textContent = '⏳ Sending...';

            try {
                const res = await fetch(`/${name}/about?message=${encodeURIComponent(message)}`, { method: 'POST' });
                if (res.ok) {
                    statusSpan.textContent = '✅ Sent!';
                } else {
                    statusSpan.textContent = `❌ Error: ${res.status}`;
                }
            } catch (err) {
                statusSpan.textContent = '❌ Network error';
            }

            setTimeout(() => { if (statusSpan.textContent !== '❌ Network error') statusSpan.textContent = ''; }, 2000);
        };

        // Получение GET и вставка в поле ввода message
        document.getElementById('getForm').onsubmit = async (e) => {
            e.preventDefault();
            const name = document.getElementById('getRestaurant').value;

            const respone = await fetch(`/${name}/about`);
            const about = await respone.json();

            const elem = document.getElementById('sendMessage');
            elem.innerHTML = about;
        };
    </script>


    <script src="common.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>

</html>
