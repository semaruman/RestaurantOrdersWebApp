<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Админ панель | Добавление ресторана</title>
</head>

<body>

    <div style="text-align: center;">
        <nav>
            <button onclick="goToAdmin()" class="btn btn-secondary">Вернуться в админ-панель</button>
            <button onclick="goToIndex()" class="btn btn-secondary">На главную</button>
        </nav>
    </div>

    <div>
        <form id="add-restaurant-form">
            <h3>Введите название ресторана</h3>
            <input type="text" id="name" name="name">
            <button type="submit">Добавить ресторан</button>
        </form>
    </div>

    <script>
        document.getElementById('add-restaurant-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('name').value;
            const response = await fetch(`/${name}`, {
                method: 'POST'
            });
        });
    </script>

    <script src="common.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>

</html>
